name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d')
          SHORT_SHA=${GITHUB_SHA::7}
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/planning-scraper-${BUILD_DATE}-${SHORT_SHA}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: planning-scraper
          path: app/build/outputs/apk/debug/planning-scraper-*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Delete old artifacts
        if: github.event_name == 'push'
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate \
            --jq ".artifacts[] | select(.name == \"planning-scraper\" and (.workflow_run.id | tostring) != \"${{ github.run_id }}\") | .id" | \
          while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: github.event_name == 'push'
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d')
          SHORT_SHA=${GITHUB_SHA::7}
          APK=app/build/outputs/apk/debug/planning-scraper-${BUILD_DATE}-${SHORT_SHA}.apk

          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest
          git push -f origin latest

          gh release create latest \
            --title "Planning Scraper · ${BUILD_DATE}" \
            --notes "$(printf 'Built from commit %s on %s.\n\nInstall the APK directly on your Android device.' ${SHORT_SHA} "${BUILD_DATE}")" \
            "$APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
